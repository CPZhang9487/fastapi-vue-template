[project]
site_name = "FastAPI Vue Template"
site_url = "https://cpzhang9487.github.io/fastapi-vue-template"
site_description = "FastAPI + Vue 的專案模板"
site_author = "CPZhang9487"
copyright = "Copyright &copy; 2026 CPZhang9487 · <a href='https://github.com/cpzhang9487/fastapi-vue-template/blob/main/LICENSE'>MIT License</a>"

repo_url = "https://github.com/cpzhang9487/fastapi-vue-template"
repo_name = "CPZhang9487/fastapi-vue-template"

nav = [
    "index.md",
    { "從零開始" = [
        "從零開始/0001/index.md",
    ]},
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "切換到淺色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切換到深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "切換到跟隨系統"
