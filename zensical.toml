[project]
site_name = "FastAPI Vue Template"
site_url = "https://cpzhang9487.github.io/fastapi-vue-template"
site_description = "FastAPI + Vue 的專案模板"
site_author = "CPZhang9487"
copyright = "Copyright &copy; 2026 CPZhang9487 · <a href='https://github.com/cpzhang9487/fastapi-vue-template/blob/main/LICENSE'>MIT License</a>"

repo_url = "https://github.com/cpzhang9487/fastapi-vue-template"
repo_name = "CPZhang9487/fastapi-vue-template"

nav = [
    "index.md",
    { "從零開始" = [
        "從零開始/0001/index.md",
        "從零開始/0002/index.md",
    ]},
]

[project.theme]
language = "zh-TW"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "切換到淺色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切換到深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "切換到跟隨系統"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
